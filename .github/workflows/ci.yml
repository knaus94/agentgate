name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Hosted runners restrict unprivileged user namespaces, which the sandbox tests need.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Design workflow scenarios
        run: |
          npm ci --prefix design-kit --ignore-scripts --no-audit --no-fund
          node design-kit/node_modules/playwright-core/cli.js install --with-deps chromium
          node --test --test-concurrency=1 design-kit/tests/*.test.mjs
      - name: Installer syntax
        run: |
          sh -n scripts/install.sh
          sh -n scripts/install-local.sh
      - name: Complete archive and offline installation
        run: |
          make package VERSION=0.0.0-ci
          scratch="$(mktemp -d)"
          unzip -q dist/agentgate-0.0.0-ci.zip -d "$scratch"
          cd "$scratch/agentgate-0.0.0-ci"
          sha256sum --quiet -c SHA256SUMS
          sh scripts/install-local.sh --prefix "$scratch/local bin" --no-integrations
          "$scratch/local bin/agentgate" --version
          go build -buildvcs=false -o "$scratch/from-source" ./cmd/agentgate
          "$scratch/from-source" help
