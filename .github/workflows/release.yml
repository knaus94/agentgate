name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Hosted runners restrict unprivileged user namespaces, which the sandbox tests need.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Design workflow scenarios
        run: |
          npm ci --prefix design-kit --ignore-scripts --no-audit --no-fund
          node design-kit/node_modules/playwright-core/cli.js install --with-deps chromium
          node --test --test-concurrency=1 design-kit/tests/*.test.mjs
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags="-s -w -X github.com/${GITHUB_REPOSITORY}/internal/update.Version=${version} -X github.com/${GITHUB_REPOSITORY}/internal/update.Repo=${GITHUB_REPOSITORY}"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$flags" -o "dist/$arch/agentgate" ./cmd/agentgate
            tar -C "dist/$arch" -czf "dist/agentgate_linux_${arch}.tar.gz" agentgate
            # The tool was called claude-dev. An install under that name updates by fetching an archive of
            # that name; it gets this same binary and renames itself on the next `install`.
            cp "dist/$arch/agentgate" "dist/$arch/claude-dev"
            tar -C "dist/$arch" -czf "dist/claude-dev_linux_${arch}.tar.gz" claude-dev
          done
          (cd dist && sha256sum agentgate_linux_*.tar.gz claude-dev_linux_*.tar.gz > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/agentgate_linux_*.tar.gz dist/claude-dev_linux_*.tar.gz dist/checksums.txt --generate-notes --verify-tag
